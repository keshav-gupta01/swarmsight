# /etc/nginx/sites-available/swarmsight
# Drop this file on the EC2 instance, then:
#   sudo ln -s /etc/nginx/sites-available/swarmsight /etc/nginx/sites-enabled/swarmsight
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo nginx -s reload

server {
    listen 8000 default_server;
    server_name _;

    # Upstream: Docker container (port-swappable)
    # Update the port here during a zero-downtime swap, then `nginx -s reload`
    upstream swarmsight_backend {
        server 127.0.0.1:8001;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://swarmsight_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # All other traffic
    location / {
        proxy_pass http://swarmsight_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
